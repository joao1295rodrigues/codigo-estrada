name: Gerar APK

# Compila a app (pasta app/) e publica o APK em "Releases". Gratuito em repositórios públicos.
# Arranca sozinho quando a pasta app/ muda, ou manualmente em Actions → Gerar APK → Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'questions.js'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: gerar-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Sincronizar perguntas do site
        run: npm run sync

      - name: Testes da lógica
        run: npm test

      - name: Gerar o projeto Android
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'

      - name: Ajustar compilação (arquiteturas comuns e memória)
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,armeabi-v7a/' android/gradle.properties
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m/' android/gradle.properties

      - name: Compilar o APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Preparar o ficheiro
        run: cp android/app/build/outputs/apk/release/app-release.apk codigo-estrada.apk

      - uses: actions/upload-artifact@v4
        with:
          name: codigo-estrada-apk
          path: app/codigo-estrada.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Código da Estrada (APK)
          body: |
            APK da app Código da Estrada (Android). Descarrega o ficheiro `codigo-estrada.apk`, abre-o no telemóvel e, se o Android pedir, permite instalar de fontes desconhecidas.
            Compilado automaticamente a partir do código deste repositório.
          files: app/codigo-estrada.apk
          make_latest: true
