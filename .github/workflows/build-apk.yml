name: Gerar APK

# Compila a app (pasta app/) em três versões, em paralelo, e publica os APKs em "Releases":
#   codigo-estrada.apk               (com anúncios)
#   codigo-estrada-sem-anuncios.apk  (sem anúncios)
#   codigo-estrada-diagnostico.apk   (ecrã de diagnóstico dos anúncios)
# Gratuito em repositórios públicos. Arranca sozinho quando a pasta app/ muda, ou em Actions → Gerar APK → Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'questions.js'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: gerar-apk
  cancel-in-progress: true

jobs:
  apk:
    strategy:
      fail-fast: false
      matrix:
        variant: [com-anuncios, sem-anuncios, diagnostico]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      NO_ADS: ${{ matrix.variant == 'sem-anuncios' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Versão sem anúncios (remove o SDK do AdMob)
        if: matrix.variant == 'sem-anuncios'
        run: |
          npm uninstall react-native-google-mobile-ads --no-save
          cp src/ads.stub.js src/ads.js
          cp src/Diagnostic.stub.js src/Diagnostic.js

      - name: Versão de diagnóstico (abre o ecrã de diagnóstico dos anúncios)
        if: matrix.variant == 'diagnostico'
        run: |
          printf '{"mode":"diagnostico"}' > src/adsmode.json

      - name: Sincronizar perguntas do site
        run: npm run sync

      - name: Testes da lógica
        run: npm test

      - name: Gerar o projeto Android
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'

      - name: Ajustar compilação (arquiteturas comuns e memória)
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,armeabi-v7a/' android/gradle.properties
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m/' android/gradle.properties

      - name: Compilar o APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Preparar o ficheiro
        run: |
          case "${{ matrix.variant }}" in
            sem-anuncios) N=codigo-estrada-sem-anuncios.apk ;;
            diagnostico) N=codigo-estrada-diagnostico.apk ;;
            *) N=codigo-estrada.apk ;;
          esac
          cp android/app/build/outputs/apk/release/app-release.apk "$N"
          echo "APK_NAME=$N" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variant }}
          path: app/${{ env.APK_NAME }}

  publish:
    needs: apk
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: apks
          merge-multiple: true

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Código da Estrada (APK)
          body: |
            APKs da app Código da Estrada (Android). Descarrega o ficheiro, abre-o no telemóvel e, se o Android pedir, permite instalar de fontes desconhecidas.
            - `codigo-estrada.apk`: versão com anúncios.
            - `codigo-estrada-sem-anuncios.apk`: versão sem anúncios.
            - `codigo-estrada-diagnostico.apk`: ecrã de diagnóstico dos anúncios (para descobrir erros).
            Compilado automaticamente a partir do código deste repositório.
          files: apks/*.apk
          make_latest: true
